---
# ansible/site.yml
# Deploy: Nginx + PostgreSQL Docker container + Spring Boot app container + HTTPS

- name: Deploy Internal Developer Portal
  hosts: app
  become: true
  gather_facts: true

  vars:
    app_port: 8080
    db_port: 5432
    db_name: idpdb
    db_user: idpuser
    nginx_conf_path: /etc/nginx/sites-available/idp
    env_dir: /opt/idp
    ghcr_image_lower: "{{ lookup('env', 'GHCR_IMAGE') | lower }}"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') }}"
    domain: devportal.royalbengal.xyz
    certbot_email: admin@royalbengal.xyz
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"

  tasks:

    # ── Prepare env directory ─────────────────────────────────────────────
    - name: Create application config directory
      ansible.builtin.file:
        path: "{{ env_dir }}"
        state: directory
        mode: '0700'
        owner: root
        group: root

    - name: Write PostgreSQL env file from template
      ansible.builtin.template:
        src: templates/postgres.env.j2
        dest: "{{ env_dir }}/postgres.env"
        mode: '0600'
        owner: root
        group: root
      no_log: true

    - name: Write application env file from template
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: "{{ env_dir }}/app.env"
        mode: '0600'
        owner: root
        group: root
      no_log: true

    # ── Nginx + Certbot ───────────────────────────────────────────────────
    - name: Install Nginx and Certbot
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: true

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Write temporary HTTP-only Nginx config (for certbot challenge)
      ansible.builtin.copy:
        dest: "{{ nginx_conf_path }}"
        mode: '0644'
        content: |
          server {
              listen 80;
              server_name {{ domain }} _;
              client_max_body_size 10m;
              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 60s;
              }
          }

    - name: Enable Nginx vhost
      ansible.builtin.file:
        src: "{{ nginx_conf_path }}"
        dest: /etc/nginx/sites-enabled/idp
        state: link

    - name: Ensure Nginx is running (needed for ACME challenge)
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Reload Nginx with temp config
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Check if SSL certificate already exists
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ domain }}/fullchain.pem
      register: cert_stat

    - name: Obtain Let's Encrypt certificate (if not already present)
      ansible.builtin.shell:
        cmd: >
          certbot certonly --nginx --non-interactive --agree-tos
          -m {{ certbot_email }}
          -d {{ domain }}
      when: not cert_stat.stat.exists
      changed_when: true

    - name: Write final Nginx config with SSL from template
      ansible.builtin.template:
        src: templates/nginx-idp.conf.j2
        dest: "{{ nginx_conf_path }}"
        mode: '0644'
      notify: Reload Nginx

    - name: Ensure certbot renewal timer is enabled
      ansible.builtin.service:
        name: certbot.timer
        state: started
        enabled: true
      failed_when: false

    # ── GHCR login ─────────────────────────────────────────────────────────
    - name: Log in to GHCR
      ansible.builtin.shell:
        cmd: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      environment:
        GHCR_TOKEN: "{{ lookup('env', 'GHCR_TOKEN') }}"
        GITHUB_ACTOR: "{{ lookup('env', 'GITHUB_ACTOR') }}"
      no_log: true
      changed_when: true

    # ── Named volume for PostgreSQL data persistence ───────────────────────
    - name: Create named Docker volume for PostgreSQL data
      ansible.builtin.shell:
        cmd: docker volume create idp-postgres-data
      register: vol_create
      changed_when: "'idp-postgres-data' in vol_create.stdout"

    # ── PostgreSQL container ───────────────────────────────────────────────
    - name: Pull PostgreSQL image
      ansible.builtin.shell:
        cmd: docker pull postgres:16-alpine
      register: pg_pull
      changed_when: "'Downloaded newer image' in pg_pull.stdout"

    - name: Stop existing PostgreSQL container
      ansible.builtin.shell:
        cmd: docker rm -f idp-postgres
      register: pg_rm
      failed_when: pg_rm.rc not in [0, 1]
      changed_when: pg_rm.rc == 0

    - name: Start PostgreSQL container with persistent named volume
      ansible.builtin.shell:
        cmd: >
          docker run -d --name idp-postgres --restart unless-stopped
          -p 127.0.0.1:{{ db_port }}:5432
          -v idp-postgres-data:/var/lib/postgresql/data
          --env-file {{ env_dir }}/postgres.env
          postgres:16-alpine
      changed_when: true

    - name: Wait for PostgreSQL to be ready
      ansible.builtin.shell:
        cmd: docker exec idp-postgres pg_isready -U {{ db_user }} -d {{ db_name }}
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 15
      delay: 5
      changed_when: false

    # ── Sync DB password to match secret (handles named volume re-use) ─────
    # The named volume keeps the password from initdb; ALTER USER ensures
    # it always matches the current DB_PASSWORD secret, preventing auth
    # failures when the secret is rotated.
    - name: Sync DB user password to current secret
      ansible.builtin.shell:
        cmd: >
          docker exec idp-postgres psql -U {{ db_user }} -d {{ db_name }}
          -c "ALTER USER {{ db_user }} WITH PASSWORD '{{ db_password }}';"
      no_log: true
      changed_when: true

    # ── Spring Boot app container ──────────────────────────────────────────
    - name: Pull application Docker image
      ansible.builtin.shell:
        cmd: docker pull "{{ ghcr_image_lower }}:{{ image_tag }}"
      register: app_pull
      changed_when: "'Downloaded newer image' in app_pull.stdout"

    - name: Stop existing application container
      ansible.builtin.shell:
        cmd: docker rm -f idp-app
      register: app_rm
      failed_when: app_rm.rc not in [0, 1]
      changed_when: app_rm.rc == 0

    - name: Start Spring Boot application container
      ansible.builtin.shell:
        cmd: >
          docker run -d --name idp-app --restart unless-stopped
          --link idp-postgres:idp-postgres
          -p 127.0.0.1:{{ app_port }}:8080
          --env-file {{ env_dir }}/app.env
          "{{ ghcr_image_lower }}:{{ image_tag }}"
      changed_when: true

    - name: Wait for application health endpoint
      ansible.builtin.shell:
        cmd: curl -sf http://127.0.0.1:{{ app_port }}/actuator/health
      register: health_check
      until: health_check.rc == 0
      retries: 20
      delay: 15
      changed_when: false

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
