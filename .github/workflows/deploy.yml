      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Install Ansible core
      run: pip install ansible-core
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    - id: get_ip
      name: Get instance IP from Terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"ip=$(terraform output -raw instance_public_ip)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: SSH-keyscan
      run: ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts
      env:
        HOST: ${{ steps.get_ip.outputs.ip }}
    - name: Generate Ansible inventory
      run: "printf '[app]\\n%s ansible_user=%s ansible_ssh_private_key_file=~/.ssh/deploy_key\\\
        n' \\\n  \"${HOST}\" \"${SSH_USER}\" > /tmp/inventory.ini\n"
      env:
        HOST: ${{ steps.get_ip.outputs.ip }}
        SSH_USER: ${{ secrets.SSH_USER }}
    - name: Deploy application via Ansible
      run: ansible-playbook -i /tmp/inventory.ini ansible/site.yml
      env:
        ANSIBLE_HOST_KEY_CHECKING: 'False'
  verify:
    runs-on: ubuntu-latest
    needs:
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - id: get_ip
      name: Get instance IP from Terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
