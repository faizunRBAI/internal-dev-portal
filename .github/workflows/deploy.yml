    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    - id: get_ip
      name: Get instance IP from Terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"ip=$(terraform output -raw instance_public_ip)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Wait for SSH availability
      run: "for i in $(seq 1 30); do\n  if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5\
        \ \\\n      -i ~/.ssh/deploy_key \"${SSH_USER}@${HOST}\" echo ok 2>/dev/null;\
        \ then\n    echo \"SSH is ready\"\n    break\n  fi\n  echo \"Attempt $i: SSH\
        \ not ready, waiting 10s...\"\n  sleep 10\ndone\n"
      env:
        HOST: ${{ steps.get_ip.outputs.ip }}
        SSH_USER: ${{ secrets.SSH_USER }}
    - name: SSH-keyscan
      run: ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts
      env:
        HOST: ${{ steps.get_ip.outputs.ip }}
    - name: Generate bootstrap inventory
      run: "printf '[bootstrap]\\n%s ansible_user=%s ansible_ssh_private_key_file=~/.ssh/deploy_key\\\
        n' \\\n  \"${HOST}\" \"${SSH_USER}\" > /tmp/bootstrap-inventory.ini\n"
      env:
        HOST: ${{ steps.get_ip.outputs.ip }}
        SSH_USER: ${{ secrets.SSH_USER }}
    - name: Run Puppet bootstrap via Ansible
      run: ansible-playbook -i /tmp/bootstrap-inventory.ini ansible/bootstrap.yml
      env:
        ANSIBLE_HOST_KEY_CHECKING: 'False'
  configure:
    runs-on: ubuntu-latest
    needs:
