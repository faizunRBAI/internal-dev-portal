name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
        cache: maven
    - name: Run Checkstyle
      run: mvn checkstyle:check -B --no-transfer-progress
  test:
    runs-on: ubuntu-latest
    needs:
