name: performance
'on':
  workflow_dispatch: {}
jobs:
  k6-perf:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - id: get_ip
      name: Get instance IP from Terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"ip=$(terraform output -raw instance_public_ip)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Install k6
      run: 'curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg

        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb
        stable main" | sudo tee /etc/apt/sources.list.d/k6.list

        sudo apt-get update -qq

        sudo apt-get install -y k6

        '
    - name: Run k6 performance test
      run: k6 run k6/performance-test.js --out json=k6-results.json
      env:
        BASE_URL: http://${{ steps.get_ip.outputs.ip }}
    - name: Upload k6 results
      uses: actions/upload-artifact@v4
      with:
        name: k6-performance-report
        path: k6-results.json
