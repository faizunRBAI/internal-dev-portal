version: 1
name: internal-dev-portal
vcs: github
rollback:
  strategy: manual

stages:

  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 10
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run Checkstyle
        run: mvn checkstyle:check -B --no-transfer-progress

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 30
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run unit tests
        run: mvn test -B --no-transfer-progress -Dgroups=unit
      - name: Run integration tests
        run: mvn verify -B --no-transfer-progress -Dgroups=integration
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  - id: security
    kind: security
    needs: [lint]
    timeout_minutes: 60
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run SpotBugs analysis
        run: mvn spotbugs:check -B --no-transfer-progress
      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -B --no-transfer-progress -DfailBuildOnCVSS=7 -DsuppressionFile=owasp-suppressions.xml
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: target/dependency-check-report.html

  - id: build-push
    kind: build_push
    needs: [test, security]
    timeout_minutes: 20
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build application JAR
        run: mvn package -B --no-transfer-progress -DskipTests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repository name
        id: repo_lower
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo_lower.outputs.name }}:${{ github.sha }},ghcr.io/${{ steps.repo_lower.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  - id: provision
    kind: provision
    needs: [build-push]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform Validate
        working-directory: infra
        run: terraform validate
      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan

  - id: puppet-bootstrap
    kind: custom
    needs: [provision]
    timeout_minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Install Ansible core
        run: pip install ansible-core
      - name: Install Ansible collections for bootstrap
        run: ansible-galaxy collection install community.general
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Get instance IP from Terraform state
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Wait for SSH availability
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                -i ~/.ssh/deploy_key "${SSH_USER}@${HOST}" echo ok 2>/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Attempt $i: SSH not ready, waiting 10s..."
            sleep 10
          done
      - name: SSH-keyscan
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts
      - name: Generate bootstrap inventory
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          printf '[bootstrap]\n%s ansible_user=%s ansible_ssh_private_key_file=~/.ssh/deploy_key\n' \
            "${HOST}" "${SSH_USER}" > /tmp/bootstrap-inventory.ini
      - name: Run Puppet bootstrap via Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i /tmp/bootstrap-inventory.ini ansible/bootstrap.yml

  - id: configure
    kind: configure
    needs: [puppet-bootstrap]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Install Ansible core
        run: pip install ansible-core
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Get instance IP from Terraform state
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: SSH-keyscan
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts
      - name: Generate Ansible inventory
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          printf '[app]\n%s ansible_user=%s ansible_ssh_private_key_file=~/.ssh/deploy_key\n' \
            "${HOST}" "${SSH_USER}" > /tmp/inventory.ini
      - name: Deploy application via Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i /tmp/inventory.ini ansible/site.yml

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Get instance IP from Terraform state
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Health check /actuator/health
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: |
          curl --fail --retry 15 --retry-delay 20 --retry-all-errors \
            "http://${HOST}/actuator/health"

pipelines:
  - id: performance
    stages:
      - id: k6-perf
        kind: custom
        needs: []
        timeout_minutes: 15
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
          - name: Get instance IP from Terraform state
            id: get_ip
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
              echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
          - name: Install k6
            run: |
              curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
              sudo apt-get update -qq
              sudo apt-get install -y k6
          - name: Run k6 performance test
            env:
              BASE_URL: http://${{ steps.get_ip.outputs.ip }}
            run: k6 run k6/performance-test.js --out json=k6-results.json
          - name: Upload k6 results
            uses: actions/upload-artifact@v4
            with:
              name: k6-performance-report
              path: k6-results.json
